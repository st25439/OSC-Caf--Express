{% extends "base.html" %}

{% block content %}

<div class="checkout-container">

    <h2>🧾 Checkout</h2>

    <h3>Customer Details</h3>

    <form method="POST">

        <label for="customer_name">Customer Name:</label>
        <input
            type="text"
            id="customer_name"
            name="customer_name"
            placeholder="Enter your name"
            required
        >

        <br><br>

        <label for="pickup_time">Pickup Time:</label>
        <input
            type="time"
            id="pickup_time"
            name="pickup_time"
            required
        >

        <h3>Order Summary</h3>

        <ul>

            {% for item in cart %}

            <li>
                {{ item.name }}
                × {{ item.quantity }}
                -
                ${{ "%.2f"|format(item.price * item.quantity) }}
            </li>

            {% endfor %}
